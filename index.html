<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp WebRTC Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --wa-teal: #075E54; --wa-green: #25D366; --wa-blue: #34B7F1; --wa-bg: #efe7de; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #dadbd3; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        
        /* WHATSAPP CALL UI */
        #call-screen { position: fixed; inset: 0; background: #0b141a; color: white; z-index: 9000; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 20px; }
        #remote-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
        #local-video { position: absolute; top: 25px; right: 20px; width: 100px; height: 140px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); z-index: 9500; object-fit: cover; background: #222; transition: 0.3s; }
        .call-overlay-ui { z-index: 9100; text-align: center; width: 100%; pointer-events: none; }
        .call-info img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        .call-controls { z-index: 9200; display: flex; gap: 20px; margin-bottom: 40px; pointer-events: auto; }
        .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-size: 24px; transition: 0.2s; }
        .hangup { background: #ea0038; color: white; }
        .mute, .camera { background: rgba(255,255,255,0.15); color: white; backdrop-filter: blur(10px); }
        .mute.active, .camera.active { background: white; color: black; }
        .accept { background: #25D366; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        /* Message & List Styles (Same as yours) */
        header { background: var(--wa-teal); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .user-item { display: flex; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .user-item img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; }
    </style>
</head>
<body>

    <div id="call-screen">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        
        <div class="call-overlay-ui" id="ui-box">
            <div class="call-info">
                <img id="call-pfp" src="">
                <h2 id="call-name-txt">User</h2>
                <p id="call-status-txt">Connecting...</p>
            </div>
        </div>

        <div class="call-controls">
            <button id="btn-mute" class="ctrl-btn mute" onclick="window.toggleMute()"><i class="fas fa-microphone"></i></button>
            <button id="btn-camera" class="ctrl-btn camera" onclick="window.toggleCamera()"><i class="fas fa-video"></i></button>
            <button id="btn-accept" class="ctrl-btn accept hidden" onclick="window.answerCall()"><i class="fas fa-phone"></i></button>
            <button id="btn-hangup" class="ctrl-btn hangup" onclick="window.endCall()"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <div id="login-section" style="padding: 50px; text-align: center;">
        <input type="email" id="email" placeholder="Email"><br><br>
        <input type="password" id="pass" placeholder="Password"><br><br>
        <button onclick="window.doLogin()">Login</button>
    </div>

    <div id="main-app" class="hidden">
        <header><b>WhatsApp Pro</b> <span id="my-id"></span></header>
        <div id="user-list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, onSnapshot, deleteDoc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBwknrSZWYYfv8GO4mz2UbZQmTaxS7kGYw", 
            authDomain: "boot-8d7d7.firebaseapp.com", 
            projectId: "boot-8d7d7", 
            appId: "1:572694384608:web:cce8c1faef1dd3105e6585"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let me = null, peerEmail = null;
        let pc = null, localStream = null;

        // STUN Servers (Important for Video/Audio across networks)
        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ],
            iceCandidatePoolSize: 10,
        };

        onAuthStateChanged(auth, u => {
            if(u) {
                me = u;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('my-id').innerText = u.email;
                loadUsers();
                listenForIncoming();
            }
        });

        // --- CORE WEBRTC LOGIC ---

        function setupPC(targetEmail) {
            pc = new RTCPeerConnection(servers);

            // Handle Remote Stream
            pc.ontrack = (event) => {
                const remoteVid = document.getElementById('remote-video');
                if (event.streams) {
                    remoteVid.srcObject = event.streams;
                    document.getElementById('ui-box').classList.add('hidden'); // Hide info when video starts
                }
            };

            // Handle ICE Candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const candRef = collection(db, `calls/${targetEmail}/candidates`);
                    addDoc(candRef, event.candidate.toJSON());
                }
            };

            pc.onconnectionstatechange = () => {
                if(pc.connectionState === 'disconnected') window.endCall(false);
            };
        }

        window.startCall = async (type) => {
            peerEmail = prompt("Enter Peer Email to Call:"); // Normal UI se peer email mil jayega
            showUI(peerEmail, false, type);
            setupPC(peerEmail);

            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            document.getElementById('local-video').srcObject = localStream;

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await setDoc(doc(db, "calls", peerEmail), {
                offer: { type: offer.type, sdp: offer.sdp },
                caller: me.email,
                type: type,
                timestamp: Date.now()
            });

            // Listen for Answer
            onSnapshot(doc(db, "calls", peerEmail), snap => {
                const data = snap.data();
                if (data?.answer && !pc.currentRemoteDescription) {
                    pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
            });

            // Listen for Candidates
            onSnapshot(collection(db, `calls/${me.email}/candidates`), snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                    }
                });
            });
        };

        function listenForIncoming() {
            onSnapshot(doc(db, "calls", me.email), async (snap) => {
                const data = snap.data();
                if (data && data.offer && !pc) {
                    window.incomingData = data;
                    showUI(data.caller, true, data.type);
                } else if (!data && pc) {
                    window.endCall(false);
                }
            });
        }

        window.answerCall = async () => {
            const data = window.incomingData;
            setupPC(data.caller);

            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: data.type === 'video' });
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            document.getElementById('local-video').srcObject = localStream;

            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            await updateDoc(doc(db, "calls", me.email), {
                answer: { type: answer.type, sdp: answer.sdp }
            });

            onSnapshot(collection(db, `calls/${me.email}/candidates`), snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                    }
                });
            });

            document.getElementById('btn-accept').classList.add('hidden');
            document.getElementById('call-status-txt').innerText = "Connecting tracks...";
        };

        window.endCall = async (notify = true) => {
            if (notify) {
                await deleteDoc(doc(db, "calls", me.email)).catch(()=>{});
                // Cleanup candidates
                const cands = await getDocs(collection(db, `calls/${me.email}/candidates`));
                cands.forEach(d => deleteDoc(d.ref));
            }
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (pc) pc.close();
            pc = null;
            localStream = null;
            document.getElementById('call-screen').style.display = 'none';
            document.getElementById('remote-video').srcObject = null;
        };

        // --- UI & HELPERS ---
        function showUI(name, incoming, type) {
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('call-name-txt').innerText = name;
            document.getElementById('call-pfp').src = `https://ui-avatars.com/api/?name=${name}&background=random`;
            document.getElementById('call-status-txt').innerText = incoming ? "Incoming Call..." : "Calling...";
            document.getElementById('btn-accept').classList.toggle('hidden', !incoming);
            document.getElementById('ui-box').classList.remove('hidden');
        }

        window.toggleMute = () => {
            const t = localStream.getAudioTracks();
            t.enabled = !t.enabled;
            document.getElementById('btn-mute').classList.toggle('active', !t.enabled);
        };

        window.toggleCamera = () => {
            const t = localStream.getVideoTracks();
            if(t) {
                t.enabled = !t.enabled;
                document.getElementById('btn-camera').classList.toggle('active', !t.enabled);
                document.getElementById('local-video').style.opacity = t.enabled ? "1" : "0";
            }
        };

        window.doLogin = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, e, p);
        };

        async function loadUsers() {
            const snap = await getDocs(collection(db, "users"));
            const list = document.getElementById('user-list');
            list.innerHTML = "";
            snap.forEach(d => {
                if(d.data().email !== me.email) {
                    const item = document.createElement('div');
                    item.className = 'user-item';
                    item.innerHTML = `<img src="https://ui-avatars.com/api/?name=${d.data().email}"> <span>${d.data().email}</span>`;
                    item.onclick = () => { peerEmail = d.data().email; window.startCall('video'); };
                    list.appendChild(item);
                }
            });
        }
    </script>
</body>
</html>
