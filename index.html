<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Pro - Final Working</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --wa-teal: #075E54; --wa-green: #25D366; --wa-bg: #0b141a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #111; color: white; height: 100vh; overflow: hidden; }

        /* CALL SCREEN */
        #call-screen { position: fixed; inset: 0; background: var(--wa-bg); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 50px 20px; }
        #remote-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #000; }
        #local-video { position: absolute; top: 30px; right: 20px; width: 100px; height: 150px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); z-index: 10; object-fit: cover; background: #222; }
        
        .call-ui { z-index: 5; text-align: center; width: 100%; }
        .call-info img { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.2); }
        .status-tag { font-size: 14px; color: #aaa; margin-top: 5px; }

        .controls { z-index: 10; display: flex; gap: 20px; margin-bottom: 40px; }
        .btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: 0.3s; }
        .btn-end { background: #ff3b30; color: white; }
        .btn-sec { background: rgba(255,255,255,0.15); color: white; backdrop-filter: blur(10px); }
        .btn-sec.active { background: white; color: black; }
        .btn-accept { background: var(--wa-green); color: white; display: none; }

        #log-box { position: fixed; bottom: 10px; left: 10px; font-size: 10px; color: lime; z-index: 10000; pointer-events: none; max-height: 100px; overflow: hidden; }
        .hidden { display: none !important; }
        .user-card { padding:15px; background:#222; margin-top:10px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
    </style>
</head>
<body>

    <div id="log-box"></div>

    <div id="call-screen">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        
        <div class="call-ui" id="caller-details">
            <div class="call-info">
                <img id="peer-img" src="https://ui-avatars.com/api/?name=User&background=random">
                <h2 id="peer-name">User</h2>
                <p id="call-status" class="status-tag">Ringing...</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-sec" id="mute-btn" onclick="toggleAudio()"><i class="fas fa-microphone"></i></button>
            <button class="btn btn-sec" id="cam-btn" onclick="toggleVideo()"><i class="fas fa-video"></i></button>
            <button class="btn btn-accept" id="accept-btn" onclick="answerCall()"><i class="fas fa-phone"></i></button>
            <button class="btn btn-end" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

    <div id="auth-ui" style="padding: 40px; text-align: center;">
        <h2 style="color:var(--wa-green); margin-bottom:20px;">WhatsApp Pro Login</h2>
        <input type="email" id="email" placeholder="Email" style="padding: 12px; width: 100%; max-width: 300px; border-radius: 5px; border: none; margin-bottom: 15px;"><br>
        <button onclick="login()" style="padding: 12px 30px; background:var(--wa-green); color:white; border:none; border-radius:5px; font-weight:bold;">Login</button>
    </div>

    <div id="app-ui" class="hidden" style="padding: 20px;">
        <h3 style="border-bottom: 1px solid #333; padding-bottom: 10px;">Contacts Online</h3>
        <div id="user-list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBwknrSZWYYfv8GO4mz2UbZQmTaxS7kGYw", 
            authDomain: "boot-8d7d7.firebaseapp.com", 
            projectId: "boot-8d7d7", 
            appId: "1:572694384608:web:cce8c1faef1dd3105e6585"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let me = null, pc = null, localStream = null;
        const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

        function log(msg) { 
            const lb = document.getElementById('log-box');
            lb.innerHTML = `<div>> ${msg}</div>` + lb.innerHTML; 
        }

        onAuthStateChanged(auth, u => {
            if(u) {
                me = u;
                document.getElementById('auth-ui').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                log("Logged in: " + u.email);
                loadUsers();
                listenForCalls();
            }
        });

        // --- CORE WEBRTC LOGIC ---

        async function initWebRTC(peerEmail) {
            log("Initializing Connection...");
            pc = new RTCPeerConnection(servers);

            // Get Camera/Mic
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            document.getElementById('local-video').srcObject = localStream;

            // Receive Remote Stream
            pc.ontrack = (event) => {
                log("Remote Stream Found!");
                const remoteVid = document.getElementById('remote-video');
                if (event.streams && event.streams) {
                    remoteVid.srcObject = event.streams;
                    // UI Fixes
                    document.getElementById('caller-details').classList.add('hidden');
                    document.getElementById('call-status').innerText = "Connected";
                }
            };

            // ICE Candidates Handshake
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    addDoc(collection(db, `calls/${peerEmail}/candidates`), event.candidate.toJSON());
                }
            };

            pc.oniceconnectionstatechange = () => {
                log("Net Status: " + pc.iceConnectionState);
                if(pc.iceConnectionState === 'disconnected') window.endCall(false);
            };
        }

        window.startCall = async (targetEmail) => {
            log("Calling " + targetEmail + "...");
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('peer-name').innerText = targetEmail;
            
            await initWebRTC(targetEmail);

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await setDoc(doc(db, "calls", targetEmail), {
                offer: { type: offer.type, sdp: offer.sdp },
                caller: me.email,
                timestamp: Date.now()
            });

            // Listen for Answer
            onSnapshot(doc(db, "calls", targetEmail), snap => {
                const data = snap.data();
                if (data?.answer && !pc.currentRemoteDescription) {
                    log("Call Picked Up!");
                    pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
            });

            listenForCandidates(me.email);
        };

        function listenForCalls() {
            onSnapshot(doc(db, "calls", me.email), async (snap) => {
                const data = snap.data();
                if (data && data.offer && !pc) {
                    log("Incoming call...");
                    document.getElementById('call-screen').style.display = 'flex';
                    document.getElementById('accept-btn').style.display = 'flex';
                    document.getElementById('peer-name').innerText = data.caller;
                    document.getElementById('call-status').innerText = "Incoming Call...";
                    window.incomingData = data;
                } else if (!data && pc) {
                    window.endCall(false);
                }
            });
        }

        window.answerCall = async () => {
            const data = window.incomingData;
            document.getElementById('accept-btn').style.display = 'none';
            document.getElementById('call-status').innerText = "Connecting...";

            await initWebRTC(data.caller);

            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            await updateDoc(doc(db, "calls", me.email), {
                answer: { type: answer.type, sdp: answer.sdp }
            });

            log("Connected!");
            listenForCandidates(me.email);
        };

        function listenForCandidates(collectionId) {
            onSnapshot(collection(db, `calls/${collectionId}/candidates`), snap => {
                snap.docChanges().forEach(async change => {
                    if (change.type === 'added' && pc) {
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                        } catch (e) { console.error("ICE Error", e); }
                    }
                });
            });
        }

        window.endCall = async (notify = true) => {
            log("Ending Call...");
            if (notify && me) {
                await deleteDoc(doc(db, "calls", me.email)).catch(()=>{});
                // Clear candidates
                const cands = await getDocs(collection(db, `calls/${me.email}/candidates`));
                cands.forEach(async d => await deleteDoc(d.ref));
            }
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (pc) pc.close();
            setTimeout(() => location.reload(), 500); 
        };

        // --- MEDIA CONTROLS FIX ---
        window.toggleAudio = () => {
            const track = localStream.getAudioTracks();
            if(track) {
                track.enabled = !track.enabled;
                document.getElementById('mute-btn').classList.toggle('active', !track.enabled);
                log(track.enabled ? "Mic On" : "Mic Muted");
            }
        };

        window.toggleVideo = () => {
            const track = localStream.getVideoTracks();
            if(track) {
                track.enabled = !track.enabled;
                document.getElementById('cam-btn').classList.toggle('active', !track.enabled);
                document.getElementById('local-video').style.opacity = track.enabled ? "1" : "0.2";
            }
        };

        // --- LOGIN & LIST ---
        window.login = () => {
            const e = document.getElementById('email').value;
            if(!e) return alert("Enter Email");
            // Default Password used for simplicity
            signInWithEmailAndPassword(auth, e, "123456").catch(err => log("Auth Failed"));
        };

        async function loadUsers() {
            const snap = await getDocs(collection(db, "users"));
            const list = document.getElementById('user-list');
            list.innerHTML = "";
            snap.forEach(d => {
                if(d.data().email !== me.email) {
                    const div = document.createElement('div');
                    div.className = 'user-card';
                    div.innerHTML = `<span>${d.data().email}</span> <i class="fas fa-video" style="color:var(--wa-green)"></i>`;
                    div.onclick = () => startCall(d.data().email);
                    list.appendChild(div);
                }
            });
        }
    </script>
</body>
</html>
